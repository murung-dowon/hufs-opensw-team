<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H-MBTI | 외대 생존 유형 검사</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      flex-direction: column;
      background: linear-gradient(160deg, #EEF2F8 0%, #dce6f5 100%);
    }

    .start-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 600px;
      min-height: 700px;
      padding: 80px 36px 80px;
    }

    .logo-img {
      width: 220px;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
      user-select: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .title-main {
      font-size: 26px;
      font-weight: 900;
      color: var(--primary);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .title-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    .start-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,43,107,0.25);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .start-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,43,107,0.30);
    }

    .start-btn:active {
      transform: scale(0.97);
    }

    .arrow-icon {
      font-size: 22px;
      transition: transform 0.2s;
    }

    .start-btn:hover .arrow-icon {
      transform: translateX(5px);
    }

    .info-row {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .info-chip {
      background: var(--bg);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="start-card">
    <span class="logo-badge">H-MBTI / HUFS</span>
    <img src="hbti_logo.png" alt="H-MBTI 로고" class="logo-img" />
    <h1 class="title-main">외대 생존 유형 검사</h1>
    <p class="title-sub">나는 외대에서 어떻게 살아남는가?</p>

    <button class="start-btn" onclick="location.href='info.html'">
      <span>테스트 시작하기</span>
      <span class="arrow-icon">›</span>
    </button>

    <div class="info-row">
      <span class="info-chip">📋 15문항</span>
      <span class="info-chip">⏱ 약 3분</span>
      <span class="info-chip">🎯 12가지 유형</span>
    </div>
  </div>
</body>
</html>
