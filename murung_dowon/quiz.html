<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>질문 | H-MBTI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: linear-gradient(160deg, #EEF2F8 0%, #dce6f5 100%); }

    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 440px;
      padding: 28px 24px 24px;
    }

    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .q-counter {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .q-badge {
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
    }

    .question-box {
      background: var(--bg);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 18px 16px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.55;
      margin: 16px 0 20px;
      min-height: 80px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s;
      line-height: 1.45;
    }

    .option-btn:hover {
      border-color: var(--accent);
      background: #e8f0fb;
    }

    .option-btn.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .option-label {
      font-size: 13px;
      font-weight: 900;
      color: var(--accent);
      min-width: 18px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .option-btn.selected .option-label {
      color: rgba(255,255,255,0.7);
    }

    .nav-row {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s;
    }

    .btn-prev {
      background: var(--bg);
      color: var(--text-muted);
      border: 2px solid var(--border);
    }

    .btn-prev:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-prev:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn-next {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,43,107,0.22);
    }

    .btn-next:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="quiz-card">
    <div class="q-header">
      <span class="q-counter" id="qCounter">1 / 15</span>
      <span class="q-badge">H-MBTI</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:6.67%"></div>
      </div>
    </div>

    <div class="question-box" id="questionText">질문 로딩 중...</div>

    <div class="options" id="optionsArea">
      <button class="option-btn" type="button"><span class="option-label">①</span><span></span></button>
      <button class="option-btn" type="button"><span class="option-label">②</span><span></span></button>
      <button class="option-btn" type="button"><span class="option-label">③</span><span></span></button>
      <button class="option-btn" type="button"><span class="option-label">④</span><span></span></button>
    </div>

    <div class="nav-row">
      <button class="btn-nav btn-prev" id="prevBtn">← 이전</button>
      <button class="btn-nav btn-next" id="nextBtn">다음 →</button>
    </div>
  </div>

  <script>
  const questions = [
    {
      q: "월요일 1교시 교양수업 15분 전, 셔틀 줄이 끝이 없다면?",
      opts: [
        { text: "이어폰 끼고 줄 끝에서 노래를 틀고 기다린다. 어차피 탈 거임", score: { 셔틀정복자: 10, 에타관망자: 5 } },
        { text: "가방끈 조여 매고 교양관을 향해 걷기 시작한다", score: { 고행자: 10, 벼락치기: 5 } },
        { text: "\"수업은 다음 기회에...\" 동기랑 아침 먹으러 간다", score: { 출튀장인: 10, 맛집네비: 5 } },
        { text: "에타에 들어가 같은 상황인 사람들의 반응을 확인한다", score: { 에타관망자: 10, 과방실세: 5 } }
      ]
    },
    {
      q: "날씨가 미치도록 좋은 공강 시간, 당신은 어디에 있나?",
      opts: [
        { text: "명수당 벤치에 앉아 햇빛과 여유를 즐긴다", score: { 명수당낭만: 10, 명예자취: 5 } },
        { text: "백년관 라운지/열람실에 앉아 과제를 시작한다", score: { 백년관지박령: 10, 벼락치기: 5 } },
        { text: "\"이 날씨에 과제는 무슨\" 모현을 탈출해 카페나 맛집을 탐방한다", score: { 맛집네비: 10, 명수당낭만: 5 } },
        { text: "과방 소파에 자리 잡고 사람들과 수다를 떨고 있다", score: { 과방실세: 10, 학식개척자: 5 } }
      ]
    },
    {
      q: "점심 메뉴를 정할 때 당신의 스타일은?",
      opts: [
        { text: "\"오늘 학식 맛있겠는데?\" 메뉴를 브리핑한다", score: { 학식개척자: 10, 맛집네비: 5 } },
        { text: "\"외사로 먹으러 나갈까?\" 버스시간을 확인한다", score: { 맛집네비: 10, 셔틀정복자: 5 } },
        { text: "\"그냥 아무거나...\" 배달 시켜 먹는다", score: { 명예자취: 10, 명수당낭만: 5 } },
        { text: "편의점에서 대충 때우고 공부한다", score: { 백년관지박령: 10, 고행자: 5 } }
      ]
    },
    {
      q: "교수님이 \"영화 보고 소감문 제출하세요\"라고 한다면?",
      opts: [
        { text: "자연스럽게 짐을 챙겨 에어팟을 끼고 강의실을 빠져나간다", score: { 출튀장인: 10, 셔틀정복자: 5 } },
        { text: "노트북이나 태블릿을 켜고 유튜브/게임을 시작한다", score: { 에타관망자: 10, 과방실세: 5 } },
        { text: "단톡방에 \"지금 수업 끝남. 오늘 술 마실 사람?\"을 올린다", score: { 모현술고래: 10, 명예자취: 5 } },
        { text: "\"오히려 좋아\" 강의나 과제를 처리하기 시작한다", score: { 벼락치기: 10, 백년관지박령: 5 } }
      ]
    },
    {
      q: "시험 기간, 편의점에서 고르는 것은?",
      opts: [
        { text: "고카페인 음료를 집으며 오늘은 밤샘 공부한다고 다짐한다", score: { 벼락치기: 10, 백년관지박령: 5 } },
        { text: "당 충전을 위해 초콜릿과 젤리를 한가득 담는다", score: { 학식개척자: 10, 명수당낭만: 5 } },
        { text: "\"공부는 템빨이지\" 에타에 공유된 족보를 찾아본다", score: { 에타관망자: 10, 벼락치기: 5 } },
        { text: "\"공부도 식후경\" 친구와 먹을 야식 메뉴부터 정한다", score: { 맛집네비: 10, 과방실세: 5 } }
      ]
    },
    {
      q: "술자리 1차 종료! 막차 셔틀/통금 알람이 울린다면?",
      opts: [
        { text: "\"안녕!\" 인사를 남기고 정류장을 향해 전력 질주한다", score: { 셔틀정복자: 10, 출튀장인: 5 } },
        { text: "\"내 방에서 자고 가!\" 친구 자취방으로 향한다", score: { 명예자취: 10, 과방실세: 5 } },
        { text: "\"어딜 가? 이제 소주 달다.\" 자연스럽게 2차를 시작한다", score: { 모현술고래: 10, 에타관망자: 5 } },
        { text: "\"소화나 할 겸, 그냥 걸어가야지\" 언덕을 오를 준비를 한다", score: { 고행자: 10, 학식개척자: 5 } }
      ]
    },
    {
      q: "결국 막차는 떠났다... 기숙사 통금도 간당간당한 이 절망적인 상황에서?",
      opts: [
        { text: "\"친구야, 오늘만 재워줘...\" 미안한 표정으로 친구에게 물어본다", score: { 명예자취: 10, 과방실세: 5 } },
        { text: "\"해 뜰 때까지 마시면 되지.\" 평온하게 소주 한 잔을 더 따른다", score: { 모현술고래: 10, 에타관망자: 5 } },
        { text: "\"첫차까지 도서관에서 공부해야지.\" 도서관에 갈 준비를 한다", score: { 벼락치기: 10, 셔틀정복자: 5 } },
        { text: "\"난 무조건 들어간다.\" 술 깰 겸 기숙사까지 걸어간다", score: { 고행자: 10, 출튀장인: 5 } }
      ]
    },
    {
      q: "에타에 '지금 명수당에 수달 나옴!! 미친 졸귀ㅠㅠ' 사진과 함께 글이 올라오면?",
      opts: [
        { text: "\"헐 수달???\" 댓글을 달고 명수당 근처 친구에게 영통을 건다", score: { 에타관망자: 10, 과방실세: 5 } },
        { text: "\"명수달 보러 가야지\" 명수당으로 향한다", score: { 명수당낭만: 10, 맛집네비: 5 } },
        { text: "\"수달이 나오든 말든...\" 시원한 백년관에서 하던 공부를 이어간다", score: { 백년관지박령: 10, 고행자: 5 } },
        { text: "구경 가고 싶지만 셔틀 시간을 생각하며 아쉬운 마음으로 귀가한다", score: { 셔틀정복자: 10, 출튀장인: 5 } }
      ]
    },
    {
      q: "시험 공부를 1도 안 했는데 벌써 시험 전날 밤 11시라면?",
      opts: [
        { text: "각성 상태에 돌입해 족보와 전공 서적을 파고들기 시작한다", score: { 벼락치기: 10, 고행자: 5 } },
        { text: "\"모르는 건 에타에 물어보자.\" 실시간으로 질문 글을 올린다", score: { 에타관망자: 10, 학식개척자: 5 } },
        { text: "\"내일 뭐 먹지? 학식 먹을까\" 모든 걸 내려놓는다", score: { 학식개척자: 10, 출튀장인: 5 } },
        { text: "공부 대신 술 한 잔 한다", score: { 명예자취: 10, 모현술고래: 5 } }
      ]
    },
    {
      q: "과방 문을 열었을 때, 모르는 새내기들이 앉아 있다면?",
      opts: [
        { text: "\"안녕~ 난 XX학번 누구야!\" 먼저 다가가 자연스럽게 대화를 시작한다", score: { 과방실세: 10, 에타관망자: 5 } },
        { text: "냉장고에서 내 물건만 챙긴 뒤 조용히 명수당으로 향한다", score: { 명수당낭만: 10, 출튀장인: 5 } },
        { text: "\"여기 가봤어?\" 새내기들에게 맛집들을 설명하기 시작한다", score: { 맛집네비: 10, 학식개척자: 5 } },
        { text: "\"오... 사람 많네.\" 바로 백년관으로 발길을 돌린다", score: { 백년관지박령: 10, 고행자: 5 } }
      ]
    },
    {
      q: "인문경상관/교양관 가야 돼... 가파른 언덕을 오를 때 당신의 모습은?",
      opts: [
        { text: "\"이게 다 하체 운동이다.\" 묵묵히 언덕을 오른다", score: { 고행자: 10, 벼락치기: 5 } },
        { text: "강의실에 도착하기도 전에 이미 체력이 바닥난다", score: { 출튀장인: 10, 셔틀정복자: 5 } },
        { text: "\"수업 패스... 밥 먹으러 가자\" 든든하게 먹고 에너지를 충전한다", score: { 맛집네비: 10, 학식개척자: 5 } },
        { text: "너무 높다... 셔틀 타자", score: { 셔틀정복자: 10, 명수당낭만: 5 } }
      ]
    },
    {
      q: "강의가 끝나기 10분 전, 당신은 무엇을 하고 있나?",
      opts: [
        { text: "한쪽 어깨에 가방을 메고 문 쪽으로 몸을 틀고 있다", score: { 출튀장인: 10, 셔틀정복자: 5 } },
        { text: "교수님의 질문에 답하며 수업을 깔끔하게 마무리한다", score: { 과방실세: 10, 학식개척자: 5 } },
        { text: "끝날 때까지 노트북/태블릿 화면 속 필기에 집중한다", score: { 백년관지박령: 10, 벼락치기: 5 } },
        { text: "끝나고 먹을 메뉴를 고민하며 배달 앱을 둘러본다", score: { 학식개척자: 10, 맛집네비: 5 } }
      ]
    },
    {
      q: "시험이 끝난 직후, 강의실을 나오며 당신의 첫 마디는?",
      opts: [
        { text: "\"시험 끝!!! 서울/판교행 버스 타러 가자!\"", score: { 셔틀정복자: 10, 출튀장인: 5 } },
        { text: "\"야, 시험 끝났는데 술 마시자\"", score: { 모현술고래: 10, 명예자취: 5 } },
        { text: "\"학점은 죽었고, 맛있는 거나 먹으러 가야지\"", score: { 맛집네비: 10, 학식개척자: 5 } },
        { text: "\"에타에 후기 떴나? 시험 어떤 것 같대?\"", score: { 에타관망자: 10, 과방실세: 5 } }
      ]
    },
    {
      q: "술 진탕 먹고 친구 자취방 바닥에서 눈을 떴다. 내 자취방도 아닌데 드는 생각은?",
      opts: [
        { text: "\"여기가 내 집인가...?\" 익숙하게 냉장고를 열어 물을 마신다", score: { 명예자취: 10, 모현술고래: 5 } },
        { text: "\"아... 1교시 어떡하지?\" 휴강 공지를 확인한다", score: { 모현술고래: 10, 출튀장인: 5 } },
        { text: "\"우리 어제 술 마시고 시끄러웠나?\" 관련 글을 찾아본다", score: { 에타관망자: 10, 과방실세: 5 } },
        { text: "\"이제 과제 해야지...\" 씻고 바로 백년관이나 도서관으로 향한다", score: { 백년관지박령: 10, 벼락치기: 5 } }
      ]
    },
    {
      q: "학식 메뉴 공지에 '특식: 돈까스/연어덮밥/마라탕' 등이 떴을 때 당신의 반응은?",
      opts: [
        { text: "수업이 끝나자마자 식당을 향해 전력 질주한다", score: { 학식개척자: 10, 고행자: 5 } },
        { text: "동기들에게 정보를 공유하며 \"오늘 무조건 이거다. 먹으러 가자!\"를 외친다", score: { 과방실세: 10, 명수당낭만: 5 } },
        { text: "\"사람 많겠는데?\" 포장해서 명수당에서 먹을 계획을 세운다", score: { 명수당낭만: 10, 맛집네비: 5 } },
        { text: "편의점으로 간단히 해결한다", score: { 백년관지박령: 10, 셔틀정복자: 5 } }
      ]
    }
  ];

  const LABELS = ['①', '②', '③', '④'];
  let current = 0;
  let answers = new Array(questions.length).fill(null);

  const qCounter = document.getElementById('qCounter');
  const progressFill = document.getElementById('progressFill');
  const questionText = document.getElementById('questionText');
  const optionBtns = document.querySelectorAll('.option-btn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function render() {
    const q = questions[current];
    qCounter.textContent = `${current + 1} / ${questions.length}`;
    progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
    questionText.textContent = q.q;

    optionBtns.forEach((btn, i) => {
      btn.querySelector('.option-label').textContent = LABELS[i];
      btn.querySelector('span:last-child').textContent = q.opts[i].text;
      btn.classList.toggle('selected', answers[current] === i);
    });

    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === questions.length - 1 ? '결과 보기 →' : '다음 →';
  }

  optionBtns.forEach((btn, i) => {
    btn.addEventListener('click', () => {
      answers[current] = i;
      render();
    });
  });

  prevBtn.addEventListener('click', () => {
    if (current > 0) { current--; render(); }
  });

  nextBtn.addEventListener('click', () => {
    if (answers[current] === null) { alert('선택지를 먼저 골라주세요!'); return; }
    if (current < questions.length - 1) {
      current++;
      render();
    } else {
      // 점수 계산
      const scores = {};
      answers.forEach((ansIdx, qIdx) => {
        Object.entries(questions[qIdx].opts[ansIdx].score).forEach(([type, pt]) => {
          scores[type] = (scores[type] || 0) + pt;
        });
      });
      const topType = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
      localStorage.setItem('hmbti_scores', JSON.stringify(scores));
      localStorage.setItem('hmbti_result', topType);
      location.href = 'result.html';
    }
  });

  render();
  </script>
</body>
</html>
