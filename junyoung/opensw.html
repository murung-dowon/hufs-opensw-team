<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUFS SURVIVAL TYPE TEST</title>
    <link rel="stylesheet" href="userinfo.css">
</head>
<body>

    <div class="app-container">
        
        <div class="input-group">
            <div class="section-title">기본 정보 입력</div>
            <input type="text" id="userName" class="name-input" placeholder="이름을 입력해주세요" autocomplete="off">
        </div>

        <div class="input-group">
            <div class="section-title">소속 단과대 선택</div>
            <div class="college-grid" id="collegeGrid">
                <button class="college-btn">인문대학</button>
                <button class="college-btn">통번역대학</button>
                <button class="college-btn">동유럽학대학</button>
                <button class="college-btn">국제지역대학</button>
                <button class="college-btn">경상대학</button>
                <button class="college-btn">자연과학대학</button>
                <button class="college-btn">공과대학</button>
                <button class="college-btn">AI융합대학</button>
                <button class="college-btn">바이오메디컬</button>
                <button class="college-btn">자율전공학부</button>
                <button class="college-btn">융합인재대학</button>
                <button class="college-btn">기타 소속</button>
            </div>
        </div>

        <button id="startBtn" class="start-btn">시작하기</button>

    </div>

</body>
<script src="userinfo.js"></script>
</html>
